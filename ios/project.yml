name: QXMusic
targets:
  QXMusic:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: QXMusicApp/QXMusicApp/Classes
    info:
      path: QXMusic/Info.plist
      properties:
        CFBundleName: "启蒙乐谱"
        CFBundleDisplayName: "启蒙乐谱"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        LSRequiresIPhoneOS: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: QXMusic/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hamajinov.qxmusic
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
